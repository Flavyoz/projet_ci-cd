name: CI/CD

on: [push, pull_request]

jobs:
  tests-unitaires:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest tests/test_traitement.py -v

  pipeline:
    needs: tests-unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      - name: Lancer le S3 local et PostgreSQL
        run: docker compose up -d --wait

      - name: Générer les CSV
        run: python -m pipeline.main generer

      - name: Déposer les CSV dans le S3
        run: python -m pipeline.main deposer

      - name: Créer les tables
        run: python -m pipeline.main creer-tables

      - name: Traiter les fichiers (avec 1 panne simulée au téléchargement et 2 à l'insertion)
        env:
          FAIL_DOWNLOAD_TIMES: "1"
          FAIL_INSERT_TIMES: "2"
        run: python -m pipeline.main traiter

      - name: Relancer le traitement (aucun fichier ne doit être retraité)
        run: python -m pipeline.main traiter

      - name: Test d'intégration (valeurs en base)
        run: pytest tests/test_integration.py -v

  # CD : si les tests et la pipeline passent sur main, on déploie la production.
  # Le job tourne sur un "self-hosted runner" : la machine de production elle-même (PC ou VM avec Docker).
  deploiement:
    needs: pipeline
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    concurrency: production   # jamais deux déploiements en même temps
    env:
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image et (re)démarrer S3, PostgreSQL et le traitement planifié
        run: docker compose -f docker-compose.prod.yml -p transactions-prod up -d --build --wait --remove-orphans

      - name: Vérifier que le traitement accède à la base
        run: docker compose -f docker-compose.prod.yml -p transactions-prod exec -T traitement python -m pipeline.main creer-tables

      - name: Etat des services
        run: docker compose -f docker-compose.prod.yml -p transactions-prod ps

      - name: Derniers logs du traitement
        run: docker compose -f docker-compose.prod.yml -p transactions-prod logs --tail 30 traitement
